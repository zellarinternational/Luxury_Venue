name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Module boundary check (geometry-source isolation)
        run: npm run boundaries

      - name: Unit tests (placement algorithm)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build-time only; no real DB needed to produce a production bundle.
          DATABASE_URL: postgres://evs:evs_dev_password@localhost:5432/evs_dev
