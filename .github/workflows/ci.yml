name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://evs:evs_dev_password@localhost:5432/evs_dev

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evs
          POSTGRES_PASSWORD: evs_dev_password
          POSTGRES_DB: evs_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Module boundary check (geometry-source isolation)
        run: npm run boundaries

      - name: Unit tests (placement algorithm)
        run: npm run test

      - name: Migrate + seed DB
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build
        run: npm run build
